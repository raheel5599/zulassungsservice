name: TARIQ Office - Hetzner Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'office/**'
      - '.github/workflows/office-deploy.yml'
permissions:
  contents: read
concurrency:
  group: tariq-office-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate connected portals before deployment
        working-directory: office
        run: |
          python -m unittest discover -s api -v
          npm ci --no-audit --no-fund
          npm run build
          npm run test:views
      - name: Check required secrets
        env:
          HOST: 167.233.32.243
          USER: fpadmin
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN" || (echo "Hetzner-Secrets fehlen"; exit 1)
      - name: Deploy with SSH
        env:
          HOST: 167.233.32.243
          USER: fpadmin
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" 'set -eu
            mkdir -p /opt/tariq-zulassungsservice
            if [ ! -d /opt/tariq-zulassungsservice/.git ]; then
              git clone https://github.com/raheel5599/zulassungsservice.git /opt/tariq-zulassungsservice
            fi
            cd /opt/tariq-zulassungsservice
            git fetch origin main
            git checkout -B main origin/main
            cd office
            docker compose -f compose.yml up -d --build --remove-orphans
            docker compose -f compose.yml ps
            echo "Checking the portal API through nginx"
            test "$(curl -fsS --max-time 10 http://127.0.0.1:8091/api/health)" = "{\"ok\": true}"
            bash configure-domain.sh
            test "$(curl -fsS --max-time 10 --resolve zulassung.tariq-itconsulting.de:443:127.0.0.1 https://zulassung.tariq-itconsulting.de/api/health)" = "{\"ok\": true}"
          '
